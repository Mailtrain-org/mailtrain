name: Build and send a campaign

on:
  pull_request:
  push:
    branches: [v2, v3]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/v3' && '["amd64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - name: Test server boundaries
        if: matrix.platform == 'amd64'
        run: |
          npm ci --prefix shared --omit=dev --no-audit --no-fund
          npm ci --prefix server --omit=dev --no-audit --no-fund
          (cd server && node --test test/*.js)
          npm ci --prefix e2e --no-audit --no-fund
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'arm64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          push: false
          tags: mailtrain-local:v3
          cache-from: type=gha,scope=mailtrain-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=mailtrain-${{ matrix.platform }}
      - name: Send a campaign and unsubscribe
        if: matrix.platform == 'amd64'
        run: npm test --prefix e2e
